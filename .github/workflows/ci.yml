name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src app tests
      - run: ruff format --check src app tests

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run pytest
        env:
          ANTHROPIC_API_KEY: "sk-ant-placeholder-for-ci"
        run: pytest --cov=src --cov-report=term-missing

  graph-smoke:
    name: Graph smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Smoke-test graph import
        env:
          ANTHROPIC_API_KEY: "sk-ant-placeholder-for-ci"
        # Skips gracefully when the graph raises NotImplementedError
        run: |
          python - <<'EOF'
          try:
              from agent.graph import build_graph
              build_graph()
              print("Graph compiled OK")
          except NotImplementedError:
              print("Graph not yet implemented — skipping (expected in Phase 0)")
          except Exception as e:
              print(f"Unexpected error: {e}")
              raise SystemExit(1)
          EOF
